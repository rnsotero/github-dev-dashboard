<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Dev Dashboard</title>

<link rel="stylesheet" href="style.css">

<!-- AOS -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>

<h1 class="title">📊 GitHub Dev Dashboard</h1>

<div class="search-container">
  <input
    type="text"
    id="username"
    placeholder="Digite um usuário do GitHub"
    autocomplete="off"
  />
  <button id="searchBtn">Buscar</button>
</div>

<div id="loading"></div>

<!-- 👤 PERFIL (AGORA EM CIMA) -->
<div class="container">
  <div class="card profile-card" id="profileCard" data-aos="fade-up"></div>

  <!-- 📊 DASHBOARD -->
  <div class="dashboard">

    <div class="card" id="grafico-card" data-aos="fade-up">
      <h2>📊 Linguagens</h2>
      <canvas id="languageChart"></canvas>
    </div>

    <div class="card" id="repos-card" data-aos="fade-up">
      <h2>📁 Top Repositórios</h2>
      <div id="repos"></div>
    </div>

  </div>
</div>

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
AOS.init({
  duration: 800,
  once: true
});
</script>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
